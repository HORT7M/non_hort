<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Shapes Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #fdfdfd; }
    header { background: #1a1a2e; padding: 12px 20px; }
    nav a { color: #fff; text-decoration: none; margin-right: 18px; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    .content { max-width: 800px; margin: 20px auto; padding: 0 20px; }
    svg { border: 1px solid black; background: #f9f9f9; display: block; margin-bottom: 24px; max-width: 100%; height: auto; }
    text { font-family: Arial, sans-serif; }
    .highlight { fill: orange; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="../web.html">🏠 Home (web.html)</a>
      <a href="image%20audio%20video.html">Image Audio Video</a>
      <a href="canvas.html">Canvas</a>
      <a href="embed%20object%20iframe.html">Embed / Iframe</a>
    </nav>
  </header>

  <div class="content">
    <h1>SVG with Shapes and Text</h1>

    <svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
      <!-- rectangle -->
      <rect x="20" y="20" width="120" height="70" rx="8" fill="#0e4c9c" />
      <!-- circle -->
      <circle cx="220" cy="55" r="40" fill="#e53935" />
      <!-- ellipse -->
      <ellipse cx="340" cy="55" rx="60" ry="35" fill="#43a047" />
      <!-- line -->
      <line x1="430" y1="20" x2="580" y2="90" stroke="#6a1b9a" stroke-width="4" />
      <!-- polygon (triangle) -->
      <polygon points="60,280 120,170 180,280" fill="#fb8c00" />
      <!-- polyline -->
      <polyline points="220,280 270,200 320,260 370,190 420,270" fill="none" stroke="#00838f" stroke-width="3" />
      <!-- path (quadratic curve) -->
      <path d="M450 280 Q510 160 580 280" fill="none" stroke="#ad1457" stroke-width="3" />
      <!-- text -->
      <text x="300" y="145" text-anchor="middle" font-size="24">SVG Shapes</text>
      <text x="300" y="175" text-anchor="middle" font-size="18" class="highlight">text with a CSS class</text>
    </svg>

    <h2>Bonus: Simplified Flag of Cambodia</h2>
    <svg width="480" height="300" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Simplified flag of Cambodia">
      <!-- blue field -->
      <rect width="960" height="600" fill="#032ea1" />
      <!-- red center band -->
      <rect y="150" width="960" height="300" fill="#e00025" />
      <!-- simplified Angkor Wat -->
      <g fill="#ffffff">
        <rect x="330" y="400" width="300" height="40" />
        <rect x="360" y="370" width="240" height="30" />
        <polygon points="385,370 415,290 445,370" />
        <polygon points="465,370 480,230 495,370" />
        <polygon points="515,370 545,290 575,370" />
        <rect x="474" y="200" width="12" height="40" />
      </g>
    </svg>
  </div>
</body>
</html>
