<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia - Image, Audio, Video</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            line-height: 1.6;
            color: #222;
            background: #fdfdfd;
        }
        header {
            background: #1a1a2e;
            padding: 12px 20px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-right: 18px;
            font-weight: bold;
        }
        nav a:hover { text-decoration: underline; }
        main { max-width: 960px; margin: 0 auto; padding: 20px; }
        .multimedia h1 { text-align: center; }
        figure {
            margin: 30px 0;
            text-align: center;
        }
        figure img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        figcaption {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }
        audio, video {
            width: 100%;
            max-width: 640px;
            display: block;
            margin: 10px auto;
        }
        footer {
            background: #1a1a2e;
            color: #fff;
            text-align: center;
            padding: 12px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="../web.html">🏠 Home (web.html)</a>
            <a href="../img.html">img.html</a>
            <a href="canvas.html">Canvas</a>
            <a href="svg.html">SVG</a>
            <a href="embed%20object%20iframe.html">Embed / Iframe</a>
        </nav>
    </header>
    <main>
        <section id="multimedia" class="multimedia">
           <h1>Multimedia - Image, Audio, Video</h1>

            <!-- IMAGE: responsive with srcset / sizes -->
            <figure>
                <img src="../multimedia/image/FlagOfCambodia.png"
                     srcset="../multimedia/image/FlagOfCambodiaMobile.png 480w,
                             ../multimedia/image/FlagOfCambodiaTablet.png 768w,
                             ../multimedia/image/FlagOfCambodiaLarge.png 1200w"
                     sizes="(max-width: 600px) 100vw, (max-width: 900px) 768px, 920px"
                     alt="National flag of Cambodia: white Angkor Wat on a red band framed by blue borders">
                <figcaption>Flag of Cambodia — the browser picks the best size from srcset</figcaption>
            </figure>

            <!-- AUDIO -->
            <figure>
                <figcaption><strong>Nokor Reach (Royal Anthem) — Audio</strong></figcaption>
                <audio controls preload="metadata">
                    <source src="../multimedia/audio/NokorReach.mp3" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
            </figure>

            <!-- VIDEO -->
            <figure>
                <figcaption><strong>National Anthem of Cambodia — Video</strong></figcaption>
                <video controls preload="metadata" poster="../multimedia/image/FlagOfCambodia.png">
                    <source src="../multimedia/video/NationalAnthemOfCambodia.mp4" type="video/mp4">
                    Your browser does not support the video element.
                </video>
            </figure>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Web Frontend Development - Week 3</p>
    </footer>
</body>
</html>
